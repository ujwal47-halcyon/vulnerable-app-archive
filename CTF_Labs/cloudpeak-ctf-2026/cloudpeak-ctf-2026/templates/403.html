{% extends "base.html" %}
{% block title %}Forbidden — CloudPeak{% endblock %}
{% block content %}
<section class="wrap section error-page">
  <div class="error-code">403</div>
  <h1>Access denied</h1>
  <p class="muted">You don't have permission to view <code class="mono">{{ path }}</code>.</p>
  <a href="/dashboard" class="btn btn-primary">Back to dashboard</a>
</section>
{% endblock %}
